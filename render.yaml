services:
  - type: web
    name: krishivani-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://krishivani-web.onrender.com
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: krishivani-web
    runtime: static
    buildCommand: cd Frontend && npm ci && npm run build
    staticPublishPath: Frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://krishivani-api.onrender.com